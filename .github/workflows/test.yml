name: Test suites

# Reusable workflow (workflow_call only, no standalone trigger) — both
# android-build.yml and release-build.yml call this as their first job
# and gate their build/submit jobs on it (`needs: test`), so a broken
# suite blocks the actual build instead of just failing a separate,
# easy-to-ignore check.

on:
  workflow_call: {}

jobs:
  test:
    name: Run test suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit + component + performance + regression suites
        run: npx jest --ci

      - name: Bundle-size check
        run: npm run test:bundle-size
